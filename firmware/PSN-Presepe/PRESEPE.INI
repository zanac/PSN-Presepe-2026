; =============================================================================
; PSN-Presepe - parametri della scenografia
; =============================================================================
; Copia questo file nella RADICE della microSD (non in una cartella).
; Viene letto UNA SOLA VOLTA, all'accensione: dopo una modifica riavvia la centralina.
;
; Se una chiave manca, e' scritta male o ha un valore fuori dai limiti, quella
; chiave mantiene il valore predefinito (i valori scritti qui SONO i predefiniti).
; Senza microSD, o senza questo file, la centralina usa solo i predefiniti.
;
; Dopo l'avvio il display mostra l'esito della lettura:
;   "PRESEPE.INI OK"        file letto senza errori
;   "INI CON ERRORI"        alcune righe ignorate: numero di errori e prima riga sbagliata
;   "MANCA PRESEPE.INI"     microSD presente ma file non trovato
;   "SD ASSENTE"            nessuna microSD
; Il monitor seriale (115200 baud) stampa tutta la configurazione in uso.
;
; Nome del file: PRESEPE.INI. Se manca, la centralina cerca anche PRESEPE.TXT
; con lo stesso contenuto (serve per il simulatore Wokwi, che non accetta .ini).
; microSD: FAT16 o FAT32 (SD/SDHC fino a 32 GB).
;
; SINTASSI
;   [SEZIONE]            inizio di una sezione
;   chiave = valore      un parametro per riga
;   ; oppure #           da qui a fine riga e' un commento
;   Maiuscole e minuscole sono indifferenti. Massimo 127 caratteri per riga.
;   Numeri con decimali: usa il PUNTO (33.33), perche' la virgola separa i campi.
;   Si/no: 1/0, si/no, on/off, true/false.
;   Colori: R, G, B con valori da 0 (spento) a 255 (massimo).
;   Fasi: GIORNO, TRAMONTO, CREPUSCOLO, NOTTE, ALBA.
;   "% della fase": 0 = inizio della fase, 50 = meta', 100 = fine della fase.
; =============================================================================

[CICLO]
; Il potenziometro sceglie fra tre durate del ciclo completo (in secondi, 10..86400).
durata1 = 60          ; primo terzo della corsa della manopola
durata2 = 180         ; terzo centrale
durata3 = 300         ; ultimo terzo
; Corsa utile della manopola, letta su A0 (0..1023). Con il potenziometro alimentato
; a 5 V dalla scheda Rev D la corsa e' 0..1023. Vecchi cablaggi misuravano 0..680.
pot_min = 0
pot_max = 1023
pot_invertito = 1     ; 1 = manopola tutta a destra = ciclo piu' corto (cablaggio storico)
partenza = marcia     ; marcia = il ciclo parte subito dopo l'avvio, pausa = parte in pausa

[FASI]
; Inizio di ogni fase, in % del ciclo completo. Il GIORNO parte sempre da 0 e
; l'ALBA finisce a 100. I valori devono essere crescenti, altrimenti tornano
; tutti e quattro ai predefiniti.
tramonto   = 40
crepuscolo = 50
notte      = 55
alba       = 85

[RELE]
; Logica delle uscite: alta = livello HIGH eccita il rele'.
; Con la scheda Rev D (ULN2803) lascia "alta". Usa "bassa" solo con moduli
; rele' del commercio attivi bassi (montaggio su breadboard).
logica = alta
; Nomi facoltativi (massimo 12 caratteri), mostrati sul display in TEST e sul seriale.
; Definisci i nomi PRIMA degli eventi che li usano.
;nome1  = Mulino
;nome2  = Pompa
;nome3  = Casa luce
; Forzatura di un'uscita, indipendente dalla schedulazione: auto | on | off
;forza16 = off
; Gli eventi dei rele' si scrivono nelle sezioni delle fasi (rele = ...).

; =============================================================================
; LE FASI: [GIORNO]  [TRAMONTO]  [CREPUSCOLO]  [NOTTE]  [ALBA]
; =============================================================================
; Ogni sezione descrive cosa succede in quella fase: colori delle strisce RGB
; (cielo, tramonto, alba) e accensioni dei rele'. Il % e' sempre riferito alla
; fase della sezione: 0 = inizio della fase, 50 = meta', 100 = fine.
;
; STRISCE RGB - una riga = una "tappa":
;   cielo    = %, R, G, B [, curva]
;   tramonto = %, R, G, B [, curva]
;   alba     = %, R, G, B [, curva]
; In quel punto la striscia ha esattamente quel colore (0..255, 0,0,0 = spenta);
; fra una tappa e la successiva della stessa striscia il colore cambia gradualmente,
; anche attraversando piu' fasi. Dopo l'ultima tappa del ciclo la striscia va
; verso la prima tappa del ciclo successivo.
;   curva (facoltativa) = come si ARRIVA a questa tappa dalla precedente:
;     morbida  (predefinita) parte piano, accelera e rallenta arrivando
;     lineare  velocita' costante per tutto il tratto
;   Per tenere una striscia spenta in un tratto: una tappa 0,0,0 all'inizio e una
;   alla fine del tratto.
;   Per un'accensione rapida: una tappa 0,0,0 e, poco dopo (es. all'1 %), il colore
;   acceso. Piu' le due tappe sono vicine, piu' l'accensione e' rapida (anche 0.5).
;   Il 100 % di una fase e' lo stesso istante dello 0 % della fase successiva:
;   conviene scrivere sia il colore di inizio (0) sia quello di fine (100) di ogni
;   fase, cosi' ogni sezione si legge da sola. Nei due punti scrivi lo stesso colore.
;   Le righe delle diverse strisce si possono mescolare in qualsiasi ordine: il
;   firmware ordina da solo le tappe di ogni striscia. Massimo 20 tappe per striscia.
;   Le righe di una striscia in una fase sostituiscono le tappe predefinite di
;   QUELLA striscia in QUELLA fase; le altre fasi restano predefinite.
;
; RELE' - una riga = un evento:
;   rele = RELE', ON|OFF, %
;   RELE' = 1..16, Grp_GG_RR o un nome definito in [RELE]. Il rele' resta nello
;   stato raggiunto fino al suo evento successivo. Massimo 64 eventi in tutto.
;
; PER TROVARE I VALORI R, G, B: "modalita' colore". Premi TEST durante la
; schermata iniziale "by Vanni" (3 s). AVANTI sceglie la striscia (bianca), START
; conferma; poi START / AVANTI / TEST = canale R / G / B, la manopola lo regola
; (prima va "agganciata"); due clic entro 1 s = regolazione fine (+/-16).
; START tenuto 2 s = torna alla scelta; TEST tenuto 2 s = esce.

[GIORNO]
; Cielo: dal caldo al quasi bianco, bianco pieno a mezzogiorno, di nuovo caldo.
cielo    =   0,    210,  82,  18     ; inizio giorno: luce calda
cielo    =  30,    246, 220, 208     ; quasi bianca (80 % fra caldo e bianco)
cielo    =  45,    255, 255, 255     ; bianco pieno...
cielo    =  55,    255, 255, 255     ; ...tenuto fino a mezzogiorno
cielo    =  70,    246, 220, 208     ; di nuovo quasi bianca...
cielo    = 100,    210,  82,  18     ; ...e a fine giorno di nuovo calda

[TRAMONTO]
; Il cielo sbiadisce e si spegne; la striscia sinistra fa il tramonto arancio.
cielo    =   0,    210,  82,  18     ; calda all'inizio del tramonto (come a fine giorno)
cielo    =  30,     16,  16,  16     ; perde colore fino a un bianco tenue
cielo    =  38,      0,   0,   0     ; spenta...
cielo    = 100,      0,   0,   0     ; ...fino a fine tramonto
tramonto =   0,      0,   0,   0     ; spenta all'inizio del tramonto
tramonto =   1,     18,  10,   4     ; si accende rapidamente, tenue e calda
tramonto =  38,    155,  92,  16     ; picco arancio
tramonto =  82,     16,  16,  16     ; perde colore fino a un bianco tenue
tramonto = 100,      0,   0,   0     ; spenta a fine tramonto
rele     = 3, ON, 30                 ; Grp_01_03 acceso al 30 % del tramonto

[CREPUSCOLO]
; Nessuna tappa: cielo, tramonto e alba restano spente (l'ultima tappa di ognuna
; e' 0,0,0 e la successiva anche). Compaiono le stelle (vedi [STELLE]).

[NOTTE]
; Nessuna tappa: le strisce restano spente; stelle accese (vedi [STELLE]).
rele     = 3, OFF, 50                ; Grp_01_03 spento a meta' notte

[ALBA]
; La striscia destra fa l'alba; il cielo si riaccende al 38 % e sale fino al giorno.
alba     =   0,      0,   0,   0     ; spenta all'inizio dell'alba
alba     =   1,     18,  12,   5     ; si accende rapidamente, tenue e chiara
alba     =  38,    155,  78,  22     ; picco arancio chiaro
alba     =  82,     16,  16,  16     ; perde colore fino a un bianco tenue
alba     = 100,      0,   0,   0     ; spenta a fine alba
cielo    =   0,      0,   0,   0     ; cielo spento all'inizio dell'alba...
cielo    =  38,      0,   0,   0     ; ...e fino al 38 %
cielo    =  39,     10,   4,   1     ; si accende rapidamente a un minimo caldo...
cielo    = 100,    210,  82,  18     ; ...e sale fino al caldo del GIORNO

[COLORI]
; Limite di luminosita' per striscia, in % (0..100). Abbassa tutta la striscia in
; proporzione, compresa la modalita' TEST; limita anche la corrente assorbita.
lum_cielo    = 100
lum_tramonto = 100
lum_alba     = 100
; Correzione "gamma": 1 = i valori 0..255 vengono convertiti in modo che l'occhio
; percepisca passi di luminosita' regolari (senza, le luci basse salgono troppo in
; fretta e quelle alte sembrano tutte uguali). 0 = il valore va diretto sul PWM.
gamma = 1
; 1 = uscite PWM invertite. Solo per moduli MOSFET del commercio "attivi bassi";
; con la scheda Rev D lascia 0.
pwm_invertito = 0

[STELLE]
numero  = 50          ; pixel WS2811 della catena STELLE (massimo 100)
attive  = 20          ; quante stelle si accendono ogni notte, scelte a caso
lum_min = 22          ; luminosita' minima e massima di ogni stella (0..255, tienile tenui)
lum_max = 75
livello_notte = 235   ; luminosita' complessiva delle stelle a notte piena (0..255)
; Scintillio: ogni stella si spegne e si riaccende piano con un proprio periodo,
; scelto fra questi due valori (in millisecondi). Valori alti = scintillio lento.
scintillio_min = 6400
scintillio_max = 12200
; Tinta delle stelle in % per canale R, G, B (100 = pieno): 100,72,38 = bianco caldo.
colore = 100,72,38

[CASETTE]
numero  = 50              ; pixel WS2811 della catena CASETTE (massimo 100, 0 = non usata)
colore  = 90,55,20        ; colore delle finestre, R, G, B (0..255): luce calda
accendi = TRAMONTO, 50    ; si accendono al 50 % del TRAMONTO
spegni  = ALBA, 50        ; si spengono al 50 % dell'ALBA (puo' scavalcare la fine del ciclo)
fuoco   = 20              ; tremolio di ogni casa, 0..100 (0 = luce fissa, 100 = fuoco vivace)
dissolvenza_ms = 3000     ; durata dell'accensione e dello spegnimento morbidi, in ms

[SISTEMA]
; Avvio rapido. 1 = dopo la schermata iniziale "by Vanni" (3 s, sempre presente:
; in quei secondi TEST attiva la modalita' colore) la centralina parte subito
; dall'inizio del GIORNO: niente schermata della microSD (compare solo se
; PRESEPE.INI contiene errori), niente autotest luci e niente melodia.
; 0 = avvio completo: schermata iniziale, esito della microSD, poi autotest e
; melodia secondo autotest_avvio e melodia_avvio qui sotto.
fastboot = 1
buzzer = 1            ; 0 = silenzio totale (nessun bip, nessuna melodia)
beep_hz = 900         ; tono del bip dei tasti, in Hz
beep_ms = 90          ; durata del bip, in ms
melodia_avvio = 1     ; "Astro del ciel" durante l'autotest (solo con fastboot = 0)
autotest_avvio = 1    ; autotest luci di circa 22 s all'accensione (solo con fastboot = 0)
oled = 1              ; 0 = non usare il display anche se collegato
debug_ms = 5000       ; ogni quanti ms il seriale stampa lo stato (0 = mai)
