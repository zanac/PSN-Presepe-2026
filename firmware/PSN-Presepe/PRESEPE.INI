; =============================================================================
; PSN-Presepe - scenography parameters (copy this file to the ROOT of the microSD)
; =============================================================================
; Read once at power-on. Any key that is missing, misspelled or out of range
; keeps its built-in default (the values written below ARE the defaults).
; Without a microSD, or without this file, the controller runs on defaults.
; After boot the OLED shows: "PRESEPE.INI OK", "INI CON ERRORI" (+ first bad
; line), "MANCA PRESEPE.INI" or "SD ASSENTE". The serial monitor (115200)
; prints the full configuration that is in use.
;
; Syntax: [SECTION] then  key = value . Comments start with ; or # .
; Keys and words are case-insensitive. Max 127 characters per line.
; Booleans: 1/0, si/no, on/off, true/false. Colours: R,G,B (0..255).
; Phase names: GIORNO, TRAMONTO, CREPUSCOLO, NOTTE, ALBA.
; Card: FAT16/FAT32 microSD (SD/SDHC), file name PRESEPE.INI (8.3). If it is
; missing, the firmware also accepts PRESEPE.TXT (used by the Wokwi simulator).
; =============================================================================

[CICLO]
; The external potentiometer selects one of three cycle lengths (seconds).
durata1 = 60          ; first third of the knob travel (10..86400)
durata2 = 180         ; middle third
durata3 = 300         ; last third
; Useful ADC travel of the knob on A0 (0..1023). Rev D feeds the pot from 5 V,
; so the full range is 0..1023. Older wiring measured 0..680.
pot_min = 0
pot_max = 1023
pot_invertito = 1     ; 1 = historical wiring: knob fully clockwise = shortest cycle
partenza = marcia     ; marcia = start running after boot, pausa = start paused

[FASI]
; Start of each phase as % of the whole cycle (GIORNO always starts at 0,
; ALBA ends at 100). Must be strictly increasing, otherwise all four revert.
tramonto   = 40
crepuscolo = 50
notte      = 55
alba       = 85

[RELE]
; Output logic: alta = HIGH energises the relay (Rev C/D PCB with ULN2803 -> keep "alta").
logica = alta
; Optional names (max 12 characters, shown on the OLED during TEST and on serial).
; Define names BEFORE the events that use them.
;nome1  = Mulino
;nome2  = Pompa
;nome3  = Casa luce
; Force a channel regardless of the schedule: auto | on | off
;forza16 = off
;
; Schedule: evento = PHASE, RELAY, ON|OFF, % of that phase (0..100)
; RELAY = 1..16, Grp_GG_RR (GG 01..04, RR 01..04) or a name defined above.
; Events are persistent: a relay keeps its state until its next event.
; Up to 64 events. If at least one valid "evento" line is present, the file
; replaces the built-in table (default below: Grp_01_03 = relay 3).
evento = TRAMONTO, 3, ON, 30
evento = NOTTE,    3, OFF, 50

[COLORI]
; Key colours of the RGB strips (CIELO = main sky, TRAMONTO = left, ALBA = right).
giorno_caldo     = 210,82,18      ; warm daylight (start/end of GIORNO, end of ALBA)
giorno_bianco    = 255,255,255    ; full white at 33% of GIORNO
cielo_minimo     = 10,4,1         ; first glow of the sky during ALBA
tramonto_chiaro  = 18,10,4
tramonto_arancio = 155,92,16      ; sunset peak
alba_chiara      = 18,12,5
alba_arancio     = 155,78,22      ; dawn peak
bianco_coda      = 16             ; faint neutral white before a strip switches off
; Brightness limit per strip, % (also limits current). Applies in TEST as well.
lum_cielo    = 100
lum_tramonto = 100
lum_alba     = 100
gamma = 1             ; perceptual gamma ~2.0 on the PWM outputs
pwm_invertito = 0     ; 1 only for active-low driver boards

[STELLE]
numero  = 50          ; WS2811 pixels on the STELLE chain (max 100)
attive  = 20          ; stars lit each night, chosen at random
lum_min = 22          ; per-star brightness range (0..255, keep it faint)
lum_max = 75
livello_notte = 235   ; overall star level at full night (0..255)
scintillio_min = 6400 ; twinkle period range per star (ms)
scintillio_max = 12200
colore = 100,72,38    ; tint in % per channel (100,72,38 = warm white)

[CASETTE]
numero  = 50              ; WS2811 pixels on the CASETTE chain (max 100, 0 = disabled)
colore  = 90,55,20        ; warm window light
accendi = TRAMONTO, 50    ; switch on at 50% of TRAMONTO
spegni  = ALBA, 50        ; switch off at 50% of ALBA (may wrap past the end of the cycle)
fuoco   = 20              ; per-house flicker 0..100 (0 = steady light)
dissolvenza_ms = 3000     ; soft on/off time

[SISTEMA]
buzzer = 1            ; 0 = silent (no beeps, no melody)
beep_hz = 900
beep_ms = 90
melodia_avvio = 1     ; "Astro del ciel" during the power-on self test
autotest_avvio = 1    ; 0 = skip the ~22 s power-on light test
oled = 1              ; 0 = do not use the OLED even if connected
debug_ms = 5000       ; serial status interval, 0 = off
