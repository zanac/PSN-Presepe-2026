; =============================================================================
; PSN-Presepe - parametri della scenografia
; =============================================================================
; Copia questo file nella RADICE della microSD (non in una cartella).
; Viene letto UNA SOLA VOLTA, all'accensione: dopo una modifica riavvia la centralina.
;
; Se una chiave manca, e' scritta male o ha un valore fuori dai limiti, quella
; chiave mantiene il valore predefinito (i valori scritti qui SONO i predefiniti).
; Senza microSD, o senza questo file, la centralina usa solo i predefiniti.
;
; Dopo l'avvio il display mostra l'esito della lettura:
;   "PRESEPE.INI OK"        file letto senza errori
;   "INI CON ERRORI"        alcune righe ignorate: numero di errori e prima riga sbagliata
;   "MANCA PRESEPE.INI"     microSD presente ma file non trovato
;   "SD ASSENTE"            nessuna microSD
; Il monitor seriale (115200 baud) stampa tutta la configurazione in uso.
;
; Nome del file: PRESEPE.INI. Se manca, la centralina cerca anche PRESEPE.TXT
; con lo stesso contenuto (serve per il simulatore Wokwi, che non accetta .ini).
; microSD: FAT16 o FAT32 (SD/SDHC fino a 32 GB).
;
; SINTASSI
;   [SEZIONE]            inizio di una sezione
;   chiave = valore      un parametro per riga
;   ; oppure #           da qui a fine riga e' un commento
;   Maiuscole e minuscole sono indifferenti. Massimo 127 caratteri per riga.
;   Numeri con decimali: usa il PUNTO (33.33), perche' la virgola separa i campi.
;   Si/no: 1/0, si/no, on/off, true/false.
;   Colori: R, G, B con valori da 0 (spento) a 255 (massimo).
;   Fasi: GIORNO, TRAMONTO, CREPUSCOLO, NOTTE, ALBA.
;   "% della fase": 0 = inizio della fase, 50 = meta', 100 = fine della fase.
; =============================================================================

[CICLO]
; Il potenziometro sceglie fra tre durate del ciclo completo (in secondi, 10..86400).
durata1 = 60          ; primo terzo della corsa della manopola
durata2 = 180         ; terzo centrale
durata3 = 300         ; ultimo terzo
; Corsa utile della manopola, letta su A0 (0..1023). Con il potenziometro alimentato
; a 5 V dalla scheda Rev D la corsa e' 0..1023. Vecchi cablaggi misuravano 0..680.
pot_min = 0
pot_max = 1023
pot_invertito = 1     ; 1 = manopola tutta a destra = ciclo piu' corto (cablaggio storico)
partenza = marcia     ; marcia = il ciclo parte subito dopo l'avvio, pausa = parte in pausa

[FASI]
; Inizio di ogni fase, in % del ciclo completo. Il GIORNO parte sempre da 0 e
; l'ALBA finisce a 100. I valori devono essere crescenti, altrimenti tornano
; tutti e quattro ai predefiniti.
tramonto   = 40
crepuscolo = 50
notte      = 55
alba       = 85

[RELE]
; Logica delle uscite: alta = livello HIGH eccita il rele'.
; Con la scheda Rev D (ULN2803) lascia "alta". Usa "bassa" solo con moduli
; rele' del commercio attivi bassi (montaggio su breadboard).
logica = alta
; Nomi facoltativi (massimo 12 caratteri), mostrati sul display in TEST e sul seriale.
; Definisci i nomi PRIMA degli eventi che li usano.
;nome1  = Mulino
;nome2  = Pompa
;nome3  = Casa luce
; Forzatura di un'uscita, indipendente dalla schedulazione: auto | on | off
;forza16 = off
;
; Schedulazione: evento = FASE, RELE', ON|OFF, % della fase (0..100)
;   RELE' = numero 1..16, oppure Grp_GG_RR (GG 01..04, RR 01..04: rele' = (GG-1)*4 + RR),
;   oppure un nome definito sopra.
; Gli eventi "restano": un rele' mantiene lo stato fino al suo evento successivo.
; Massimo 64 eventi. Se nel file c'e' almeno un evento valido, la tabella del
; file sostituisce quella predefinita (predefinito: rele' 3 = Grp_01_03).
evento = TRAMONTO, 3, ON, 30
evento = NOTTE,    3, OFF, 50

; =============================================================================
; STRISCE RGB A TAPPE: [CIELO]  [TRAMONTO]  [ALBA]
; =============================================================================
; Ogni striscia ha una lista di "tappe". Una tappa dice: in questo punto del
; ciclo la striscia deve avere esattamente questo colore. Fra una tappa e la
; successiva la centralina cambia colore gradualmente.
;
;   tappa = FASE, % della fase, R, G, B [, curva]
;
;   FASE, %   dove si trova la tappa (es. TRAMONTO, 38 = al 38 % del tramonto).
;             Il % puo' avere decimali, col punto: 33.33
;   R, G, B   il colore in quel punto (0..255). 0, 0, 0 = spento.
;   curva     FACOLTATIVA: come si arriva a QUESTA tappa partendo dalla precedente.
;               morbida  (predefinita) il colore parte piano, accelera a meta' e
;                        rallenta arrivando: e' la dissolvenza piu' naturale,
;                        senza "scalini" all'inizio e alla fine del tratto.
;               lineare  il colore cambia a velocita' costante per tutto il tratto
;                        (all'inizio e alla fine del tratto il cambio e' piu' netto).
;
; REGOLE
;   - Scrivi le tappe in ordine di tempo, dal GIORNO all'ALBA. Una tappa che
;     torna indietro nel tempo viene ignorata e conta come errore.
;   - La lista fa il giro del ciclo: dopo l'ultima tappa la striscia va
;     gradualmente verso la PRIMA tappa del ciclo successivo.
;   - Due tappe nello stesso punto = cambio istantaneo (uno "scatto"):
;     la striscia arriva al colore della prima e riparte subito da quello della seconda.
;   - Per tenere una striscia spenta in un tratto, metti una tappa 0, 0, 0
;     all'inizio e una alla fine di quel tratto: fra le due resta spenta.
;   - Massimo 20 tappe per striscia.
;   - Se una sezione contiene almeno una tappa valida, le tappe del file
;     sostituiscono TUTTE quelle predefinite di quella striscia. Una sezione
;     assente o vuota lascia le tappe predefinite (quelle scritte qui sotto).
;   - Una sola tappa = colore fisso per tutto il ciclo.
;
; I valori qui sotto sono quelli predefiniti.

[CIELO]
; Striscia principale. Di giorno sale dal caldo al bianco pieno, lo tiene a
; mezzogiorno e torna calda; nel tramonto sbiadisce e si spegne; resta spenta
; tutta la notte; nell'alba si riaccende da un minimo caldo fino al colore del giorno.
tappa = GIORNO,     0,    210,  82,  18     ; inizio giorno: luce calda
tappa = GIORNO,    30,    246, 220, 208     ; quasi bianca: 80 % della strada fra caldo e bianco
tappa = GIORNO,    45,    255, 255, 255     ; bianco pieno...
tappa = GIORNO,    55,    255, 255, 255     ; ...tenuto fino al 55 % (mezzogiorno)
tappa = GIORNO,    70,    246, 220, 208     ; di nuovo quasi bianca, poi cala...
tappa = TRAMONTO,   0,    210,  82,  18     ; ...fino al caldo all'inizio del tramonto
tappa = TRAMONTO,  30,     16,  16,  16     ; perde colore fino a un bianco tenue
tappa = TRAMONTO,  38,      0,   0,   0     ; spenta
tappa = ALBA,      38,      0,   0,   0     ; spenta per tutta la notte fino al 38 % dell'alba
tappa = ALBA,      38,     10,   4,   1     ; scatto: si accende a un minimo caldo
; (dopo l'ultima tappa sale con curva morbida fino alla prima: GIORNO 0 del ciclo dopo)

[TRAMONTO]
; Striscia laterale sinistra, accesa solo durante la fase TRAMONTO.
tappa = TRAMONTO,   0,      0,   0,   0     ; spenta fino all'inizio del tramonto
tappa = TRAMONTO,   0,     18,  10,   4     ; scatto: si accende tenue e calda
tappa = TRAMONTO,  38,    155,  92,  16     ; picco arancio
tappa = TRAMONTO,  82,     16,  16,  16     ; perde colore fino a un bianco tenue
tappa = TRAMONTO, 100,      0,   0,   0     ; spenta a fine tramonto, e resta spenta fino al giro dopo

[ALBA]
; Striscia laterale destra, accesa solo durante la fase ALBA.
tappa = ALBA,       0,      0,   0,   0     ; spenta fino all'inizio dell'alba
tappa = ALBA,       0,     18,  12,   5     ; scatto: si accende tenue e chiara
tappa = ALBA,      38,    155,  78,  22     ; picco arancio chiaro
tappa = ALBA,      82,     16,  16,  16     ; perde colore fino a un bianco tenue
tappa = ALBA,     100,      0,   0,   0     ; spenta a fine alba

[COLORI]
; Limite di luminosita' per striscia, in % (0..100). Abbassa tutta la striscia in
; proporzione, compresa la modalita' TEST; limita anche la corrente assorbita.
lum_cielo    = 100
lum_tramonto = 100
lum_alba     = 100
; Correzione "gamma": 1 = i valori 0..255 vengono convertiti in modo che l'occhio
; percepisca passi di luminosita' regolari (senza, le luci basse salgono troppo in
; fretta e quelle alte sembrano tutte uguali). 0 = il valore va diretto sul PWM.
gamma = 1
; 1 = uscite PWM invertite. Solo per moduli MOSFET del commercio "attivi bassi";
; con la scheda Rev D lascia 0.
pwm_invertito = 0

[STELLE]
numero  = 50          ; pixel WS2811 della catena STELLE (massimo 100)
attive  = 20          ; quante stelle si accendono ogni notte, scelte a caso
lum_min = 22          ; luminosita' minima e massima di ogni stella (0..255, tienile tenui)
lum_max = 75
livello_notte = 235   ; luminosita' complessiva delle stelle a notte piena (0..255)
; Scintillio: ogni stella si spegne e si riaccende piano con un proprio periodo,
; scelto fra questi due valori (in millisecondi). Valori alti = scintillio lento.
scintillio_min = 6400
scintillio_max = 12200
; Tinta delle stelle in % per canale R, G, B (100 = pieno): 100,72,38 = bianco caldo.
colore = 100,72,38

[CASETTE]
numero  = 50              ; pixel WS2811 della catena CASETTE (massimo 100, 0 = non usata)
colore  = 90,55,20        ; colore delle finestre, R, G, B (0..255): luce calda
accendi = TRAMONTO, 50    ; si accendono al 50 % del TRAMONTO
spegni  = ALBA, 50        ; si spengono al 50 % dell'ALBA (puo' scavalcare la fine del ciclo)
fuoco   = 20              ; tremolio di ogni casa, 0..100 (0 = luce fissa, 100 = fuoco vivace)
dissolvenza_ms = 3000     ; durata dell'accensione e dello spegnimento morbidi, in ms

[SISTEMA]
; Avvio rapido. 1 = all'accensione la centralina parte subito dall'inizio del
; GIORNO: niente attesa sulla schermata iniziale, niente schermata della microSD
; (compare solo se PRESEPE.INI contiene errori), niente autotest luci e niente
; melodia. 0 = avvio completo: schermata iniziale (3 s), esito della microSD,
; poi autotest e melodia secondo autotest_avvio e melodia_avvio qui sotto.
fastboot = 1
buzzer = 1            ; 0 = silenzio totale (nessun bip, nessuna melodia)
beep_hz = 900         ; tono del bip dei tasti, in Hz
beep_ms = 90          ; durata del bip, in ms
melodia_avvio = 1     ; "Astro del ciel" durante l'autotest (solo con fastboot = 0)
autotest_avvio = 1    ; autotest luci di circa 22 s all'accensione (solo con fastboot = 0)
oled = 1              ; 0 = non usare il display anche se collegato
debug_ms = 5000       ; ogni quanti ms il seriale stampa lo stato (0 = mai)
